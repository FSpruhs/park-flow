name: Kotlin

on:
  push:
    branches: [ "master" ]
    paths:
      - "park-flow/**"
  pull_request:
    branches: [ "master" ]
    paths:
      - "park-flow/**"

jobs:
  build:
    runs-on: ubuntu-latest

    #defaults:
    #  run:
    #    working-directory: park-flow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build & Test
        run: ./gradlew build --stacktrace